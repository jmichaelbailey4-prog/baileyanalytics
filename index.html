<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bailey Analytics</title>
    <meta name="description" content="Data analytics consulting for teams that need clarity from their data.">
    <style>
        :root {
            --bg: #0A0E14;
            --panel: #0F172A;
            --border: #1E293B;
            --text: #F8FAFC;
            --muted: #94A3B8;
            --faint: #64748B;
            --blue: #38BDF8;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
            font-feature-settings: "ss01", "cv11";
        }

        nav.top-nav {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 10;
            display: flex;
            gap: 1.75rem;
        }

        nav.top-nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.875rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 500;
            padding: 0.5rem 0.25rem;
            border-bottom: 1px solid transparent;
            transition: color 200ms ease, border-color 200ms ease;
        }

        nav.top-nav a:hover,
        nav.top-nav a:focus-visible {
            color: var(--text);
            border-bottom-color: var(--blue);
        }

        nav.top-nav a:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 4px;
            border-radius: 2px;
        }

        main {
            margin-block: auto;
            width: 100%;
            max-width: 60rem;
            animation: fadeIn 600ms ease-out both;
        }

        /* ---- Hero ---- */
        .hero { text-align: center; }

        h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 600;
            letter-spacing: -0.025em;
            line-height: 1.1;
            color: var(--text);
            margin-bottom: 1.25rem;
        }

        p.tagline {
            font-size: clamp(1rem, 1.5vw, 1.125rem);
            color: var(--muted);
            line-height: 1.6;
            margin: 0 auto 1.5rem;
            max-width: 34rem;
            font-weight: 400;
        }

        a.email {
            display: inline-block;
            color: var(--blue);
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 0.01em;
            padding: 0.5rem 0;
            border-bottom: 1px solid transparent;
            transition: color 200ms ease, border-color 200ms ease;
        }

        a.email:hover,
        a.email:focus-visible {
            color: #7DD3FC;
            border-bottom-color: #7DD3FC;
        }

        a.email:focus-visible,
        a.cta:focus-visible,
        .lens:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 4px;
            border-radius: 6px;
        }

        /* ---- Live lenses section ---- */
        .lenses-wrap { margin-top: 3rem; }

        .seclabel {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--faint);
            margin-bottom: 1.1rem;
        }
        .seclabel .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #34D399;
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.18);
            flex: none;
        }
        .seclabel .line { flex: 1; height: 1px; background: var(--border); }

        .lens-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.85rem;
        }

        .lens {
            display: block;
            text-decoration: none;
            color: inherit;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.1rem 1rem;
            transition: border-color 0.2s ease, transform 0.2s ease;
        }
        .lens:hover, .lens:focus-visible {
            border-color: var(--blue);
            transform: translateY(-2px);
        }

        .lens .eb {
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.7rem;
        }
        .pill {
            font-size: 0.6rem;
            padding: 0.12rem 0.5rem;
            border-radius: 999px;
            border: 1px solid currentColor;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            flex: none;
        }
        .pill.ok { color: #34D399; }
        .pill.watch { color: #FBBF24; }
        .pill.elevated { color: #FB923C; }
        .pill.alert { color: #F87171; }
        .pill.unknown { color: var(--faint); }

        .lens .read {
            color: var(--text);
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.35;
        }
        .lens .spark { width: 100%; height: 30px; display: block; margin: 0.7rem 0 0.5rem; }
        .lens .stat { font-size: 0.72rem; color: var(--muted); }
        .lens .stat b { color: var(--text); font-weight: 600; }

        /* desktop hides the compact chip value */
        .lens .chip-val, .lens .chip-k { display: none; }

        /* ---- CTA ---- */
        .cta-wrap { text-align: center; margin-top: 1.6rem; }
        a.cta {
            display: inline-block;
            text-decoration: none;
            color: var(--blue);
            border: 1px solid var(--blue);
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            padding: 0.65rem 1.4rem;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        a.cta:hover, a.cta:focus-visible { background: var(--blue); color: var(--bg); }

        .foot {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.72rem;
            color: var(--faint);
        }
        .foot a { color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; }
        .foot a:hover { border-bottom-color: var(--muted); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---- Mobile: M2 at-a-glance chips ---- */
        @media (max-width: 640px) {
            .lenses-wrap { margin-top: 2.25rem; }
            .lens-grid { grid-template-columns: 1fr 1fr; gap: 0.6rem; }

            /* hide the full-card pieces, show the compact chip */
            .lens .read, .lens .spark, .lens .stat { display: none; }
            .lens .chip-val { display: block; color: var(--text); font-size: 1.4rem; font-weight: 600; line-height: 1; margin-top: 0.15rem; }
            .lens .chip-k { display: block; color: var(--faint); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.3rem; }
            .lens { padding: 0.85rem 0.85rem; }
            .lens .eb { margin-bottom: 0.35rem; font-size: 0.62rem; }

            .cta-wrap { margin-top: 1.25rem; }
            a.cta { display: block; width: 100%; background: var(--blue); color: var(--bg); padding: 0.85rem 0; font-size: 0.9rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            main { animation: none; }
            a.email, a.cta, .lens { transition: none; }
            .lens:hover, .lens:focus-visible { transform: none; }
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="/dashboards/">Dashboards</a>
        <a href="/about.html">About</a>
    </nav>
    <main>
        <div class="hero">
            <h1>Bailey Analytics</h1>
            <p class="tagline">Data analytics consulting for teams that need clarity from their data.</p>
            <a class="email" href="mailto:michael@baileyanalytics.com">michael@baileyanalytics.com</a>
        </div>

        <section class="lenses-wrap" id="lenses" hidden>
            <div class="seclabel"><span class="dot"></span> Live now · Economic Lenses <span class="line"></span></div>
            <div class="lens-grid" id="lens-grid"></div>
            <div class="cta-wrap"><a class="cta" href="/dashboards/">View all dashboards &rarr;</a></div>
            <div class="foot">
                Refreshed daily from <a href="https://fred.stlouisfed.org/" target="_blank" rel="noopener">FRED</a>, St. Louis Fed.
            </div>
        </section>
    </main>

    <script>
        function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
        function shortTitle(t) { return t.replace(/^The\s+/i, ""); }

        function sparkline(values, accent) {
            if (!values || values.length < 2) return "";
            const min = Math.min(...values), max = Math.max(...values), range = (max - min) || 1;
            const pts = values.map((v, i) => {
                const x = (i / (values.length - 1)) * 100;
                const y = 28 - ((v - min) / range) * 26;
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(" ");
            return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${esc(accent)}" stroke-width="2"/></svg>`;
        }

        function tile(lens) {
            const stat = (lens.key_stats || [])[0] || { k: "", v: "—" };
            const status = esc(lens.status || "unknown");
            return `
                <a class="lens" href="/dashboards/${encodeURIComponent(lens.id)}.html">
                    <div class="eb" style="color:${lens.accent}">${esc(shortTitle(lens.title))}
                        <span class="pill ${status}">${status}</span></div>
                    <div class="read">${esc(lens.headline_read)}</div>
                    ${sparkline(lens.sparkline, lens.accent)}
                    <div class="stat">${esc(stat.k)} <b>${esc(stat.v)}</b></div>
                    <div class="chip-val" style="color:${lens.accent}">${esc(stat.v)}</div>
                    <div class="chip-k">${esc(stat.k)}</div>
                </a>`;
        }

        (async function () {
            try {
                const res = await fetch("/data/lenses/index.json", { cache: "no-cache" });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const data = await res.json();
                const lenses = data.lenses || [];
                if (!lenses.length) return;
                document.getElementById("lens-grid").innerHTML = lenses.map(tile).join("");
                document.getElementById("lenses").hidden = false;
            } catch (err) {
                // Leave the section hidden — the hero stands on its own.
                console.error(err);
            }
        })();
    </script>
</body>
</html>
