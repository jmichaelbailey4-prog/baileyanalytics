<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Bailey Analytics</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root{ --bg:#0A0E14; --text:#F8FAFC; --muted:#94A3B8; --blue:#38BDF8; }
    [data-theme="light"]{ --bg:#F5F5F7; --text:#1D1D1F; --muted:#4B4B4F; --blue:#0068D1; }
    body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
      justify-content:center;text-align:center;gap:1rem;margin:0;padding:2rem;
      background:var(--bg);color:var(--text);line-height:1.5;
      font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif}
    h1{font-size:1.5rem;font-weight:600;margin:0}
    p{color:var(--muted);max-width:24rem;margin:0}
    a{color:var(--blue);text-decoration:none}
    a:hover{text-decoration:underline}
  </style>
  <!-- pwa:head -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0A0E14">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script defer src="/dashboards/personalize-core.js"></script>
  <script defer src="/dashboards/personalize.js"></script>
  <!-- theme:head -->
  <script>(function(){try{var p=(JSON.parse(localStorage.getItem("ba:prefs"))||{}).theme;var d=p==="light"||p==="dark"?p:(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",d);}catch(e){}})();</script>
</head>
<body>
  <h1>You&rsquo;re offline</h1>
  <p>Bailey Analytics needs a connection to load new pages. Pages and data you&rsquo;ve already viewed are still available — <a href="/dashboards/favorites.html">open your Favorites</a> or <a href="/">go home</a>.</p>
</body>
</html>
