name: Weekly email digest

# The subscriber email: one roundup of the whole week, Friday morning (~7am ET).
# The website still publishes Today's Brief daily (refresh-fred.yml) — only the
# email is weekly.
#
# Reads committed data only (data/brief/days/, written by the daily refresh) and
# commits nothing, so it needs no write permission and deliberately stays OUT of
# the write-main concurrency group the data workflows share.

on:
  schedule:
    # Friday 10:30 UTC: early enough that send_weekly_digest schedules the email
    # for a clean 11:00 UTC (~7am ET) rather than "now + 5 min". The day's brief
    # was committed by the 06:00 refresh hours earlier.
    - cron: "30 10 * * 5"
    # GitHub cron is best-effort and occasionally skips a slot entirely (observed
    # 2026-06-10), so a same-day backup run self-heals; the already-sent check
    # makes the second run free when the first one worked.
    - cron: "0 15 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — build and print the email, never send it"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      - name: Send the weekly roundup (Buttondown)
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        # Safe by default in the direction that matters: a manual dispatch
        # previews unless it explicitly asked to send, so a bootstrap run can
        # exercise the whole job without mailing the live list even if the
        # inputs expression ever evaluates to something unexpected. Scheduled
        # runs are never a dispatch and always send for real.
        run: |
          if [[ "$EVENT" == "workflow_dispatch" && "$DRY_RUN" != "false" ]]; then
            echo "Manual dispatch — preview only (set dry_run=false to send)."
            python scripts/send_weekly_digest.py --dry-run
          else
            python scripts/send_weekly_digest.py
          fi
