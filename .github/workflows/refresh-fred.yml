name: Refresh FRED data

on:
  schedule:
    # Daily at 06:00 UTC (just after FRED's typical morning publish window).
    # GitHub cron is best-effort and occasionally skips a slot entirely
    # (observed 2026-06-10), so a 13:00 UTC backup run self-heals the same
    # day; write_outputs skips commits when nothing changed, so the second
    # run is free when the first one worked.
    - cron: "0 6 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest FRED data (economic lenses)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_lenses.py --economic

      - name: Fetch latest markets data (FRED + CoinGecko + Yahoo)
        if: ${{ success() || failure() }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Optional: a free CoinGecko demo key raises the rate limit for the crypto
          # lens. If the secret is unset this is empty and the keyless tier is used.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python scripts/refresh_lenses.py --markets

      - name: Fetch latest energy data (EIA + FRED)
        if: ${{ success() || failure() }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/refresh_lenses.py --energy

      - name: Fetch latest housing data (FRED)
        if: ${{ success() || failure() }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_lenses.py --housing

      - name: Fetch latest consumer data (FRED)
        if: ${{ success() || failure() }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_lenses.py --consumer

      - name: Fetch latest global data (FRED + IMF + NY Fed + EPU)
        if: ${{ success() || failure() }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_lenses.py --global

      - name: Rebuild Today's Brief (no network)
        if: ${{ success() || failure() }}
        run: python scripts/refresh_lenses.py --brief

      - name: Commit and push if data changed
        if: ${{ success() || failure() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git add data/
            git commit -m "chore: refresh FRED data ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No data changes — skipping commit."
          fi
