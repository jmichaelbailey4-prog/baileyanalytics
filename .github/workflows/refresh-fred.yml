name: Refresh FRED data

on:
  schedule:
    # Daily at 06:00 UTC (just after FRED's typical morning publish window).
    # GitHub cron is best-effort and occasionally skips a slot entirely
    # (observed 2026-06-10), so a 13:00 UTC backup run self-heals the same
    # day; write_outputs skips commits when nothing changed, so the second
    # run is free when the first one worked.
    - cron: "0 6 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize every workflow that commits to main so two scheduled/dispatched
  # runs can't race the push. The per-job retry loop handles the common
  # non-fast-forward case; this prevents an unresolvable rebase conflict when a
  # run overlaps itself (manual dispatch during a cron) or another writer.
  group: write-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest FRED data (economic lenses)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_lenses.py --economic

      - name: Fetch latest markets data (FRED + CoinGecko + Yahoo)
        if: ${{ success() || failure() }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Optional: a free CoinGecko demo key raises the rate limit for the crypto
          # lens. If the secret is unset this is empty and the keyless tier is used.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python scripts/refresh_lenses.py --markets

      - name: Fetch latest energy data (EIA + FRED)
        if: ${{ success() || failure() }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/refresh_lenses.py --energy

      - name: Fetch latest housing data (FRED)
        if: ${{ success() || failure() }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_lenses.py --housing

      - name: Fetch latest consumer data (FRED)
        if: ${{ success() || failure() }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_lenses.py --consumer

      - name: Fetch latest business data (FRED)
        if: ${{ success() || failure() }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_lenses.py --business

      - name: Fetch latest global data (FRED + IMF + NY Fed + EPU)
        if: ${{ success() || failure() }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/refresh_lenses.py --global

      - name: Grade and predict (daily prediction loop)
        if: ${{ success() || failure() }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/predict.py daily

      - name: Rebuild Today's Brief (no network; includes the merged verdict)
        id: brief
        if: ${{ success() || failure() }}
        run: python scripts/refresh_lenses.py --brief

      - name: Send the daily email digest (Buttondown)
        # Gate on the brief actually rebuilding: an earlier source failure must
        # not block the email (the day's brief still published), but a failed
        # brief rebuild must (no fresh content to send). send_digest also guards
        # itself via the archive manifest — this makes the dependency explicit.
        if: ${{ steps.brief.outcome == 'success' }}
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python scripts/send_digest.py

      - name: Commit and push if data changed
        if: ${{ success() || failure() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/ feed.xml sitemap.xml og/ dashboards/ index.html)" ]]; then
            git add data/ feed.xml sitemap.xml og/ dashboards/ index.html
            git commit -m "chore: refresh FRED data ($(date -u +%Y-%m-%d))"
            # The weekly tournament/banking jobs (and the backup cron) may push to
            # main during our run, rejecting a bare push as non-fast-forward. Rebase
            # onto the latest main and retry a few times to win the race.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed on attempt $attempt."
                break
              fi
              echo "Push rejected (attempt $attempt) — rebasing onto latest main."
              git pull --rebase origin main
            done
          else
            echo "No data changes — skipping commit."
          fi
