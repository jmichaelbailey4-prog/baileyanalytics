name: Refresh banking data

on:
  schedule:
    # Weekly, Mondays 07:00 UTC. Call Report data only updates quarterly (plus a
    # revision trickle), so weekly is plenty; use "Run workflow" to refresh on demand
    # when a new quarter is filed.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with the other workflows that commit to main so they can't race the
  # push (the per-job retry loop handles the common non-fast-forward case).
  group: write-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        # refresh_lenses.py imports Pillow (og cards) at module level since the
        # distribution phase, so even --banking needs the requirements installed.
        run: pip install -r requirements.txt

      - name: Fetch latest FDIC data (banking lenses)
        # No API key needed — FDIC BankFind is public. Full re-fetch each run so
        # restated Call Reports self-heal (~3 min; quarterly aggregation, no cache).
        run: python scripts/refresh_lenses.py --banking

      - name: Rebuild Today's Brief (no network)
        if: ${{ success() || failure() }}
        run: python scripts/refresh_lenses.py --brief

      - name: Commit and push if data changed
        if: ${{ success() || failure() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/ feed.xml sitemap.xml og/ dashboards/ index.html)" ]]; then
            git add data/ feed.xml sitemap.xml og/ dashboards/ index.html
            git commit -m "chore: refresh banking data ($(date -u +%Y-%m-%d))"
            # The daily refresh-fred job (and the backup cron) may push to main
            # during our run, rejecting a bare push as non-fast-forward. Rebase
            # onto the latest main and retry a few times to win the race.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed on attempt $attempt."
                break
              fi
              echo "Push rejected (attempt $attempt) — rebasing onto latest main."
              git pull --rebase origin main
            done
          else
            echo "No data changes — skipping commit."
          fi
